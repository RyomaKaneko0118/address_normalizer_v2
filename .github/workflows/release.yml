name: Release binaries
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # Releasesへのアップロードに必要

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libaddress_normalizer.so
            asset: libaddress_normalizer-x86_64-linux-gnu.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: libaddress_normalizer.so
            asset: libaddress_normalizer-aarch64-linux-gnu.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libaddress_normalizer.dylib
            asset: libaddress_normalizer-x86_64-apple-darwin.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libaddress_normalizer.dylib
            asset: libaddress_normalizer-aarch64-apple-darwin.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: address_normalizer.dll
            asset: address_normalizer-x86_64-windows-msvc.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cross
          rustup target add ${{ matrix.target }}
      - name: Cross build
        working-directory: ext/address_normalizer
        run: cross build --release --target ${{ matrix.target }}
      - name: Rename artifact
        working-directory: ext/address_normalizer
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact }} ${{ matrix.asset }}
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ext/address_normalizer/${{ matrix.asset }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern '*.so' --pattern '*.dylib' --pattern '*.dll'
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.so *.dylib *.dll > SHA256SUMS
          cat SHA256SUMS
      - name: Upload SHA256SUMS to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS
